<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canada Night Models</title>
<meta name="description" content="Miniatures of downtown Calgary and Toronto at night, built from OpenStreetMap footprints, with the Calgary Tower and the CN Tower in orange. Pinch to zoom toward the tower, drag to look around, and use the arrows to switch city.">
<!-- Map data: © OpenStreetMap contributors, ODbL. Footprints, parks, river and streets are simplified from OSM. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
<style>
  /* Layout: one dark stage holding a three-quarter view of a city model that zooms with a pinch and drifts a little with a drag; a glass province label sits top right, small arrows bottom right slide the view to the next city, and a glass tooltip names the tower on hover. */
  :root {
    --bg: #070a12;
    --ink: #e8ecf5;
    --ink-dim: #9aa4b8;
    --glass: rgba(0, 0, 0, 0.2);
    --glass-edge: rgba(255, 255, 255, 0.16);
    --accent: #ff5900;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding-block: 1rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    position: relative;
    width: min(100%, max(320px, min(1500px, calc((100vh - 2rem) * 1.7))));
    aspect-ratio: 16 / 9;
    background: var(--bg);
    overflow: hidden;
  }
  @media (max-width: 600px) { .stage { aspect-ratio: 4 / 5; } }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; outline: none; }
  canvas:focus-visible { outline: 1px solid var(--glass-edge); outline-offset: -1px; }
  canvas { cursor: grab; }
  canvas.over { cursor: pointer; }
  canvas.drag { cursor: grabbing; }

  /* Soft focus toward the top and bottom edges, like a tilt-shift lens. */
  .focus { position: absolute; left: 0; right: 0; pointer-events: none; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .focus.top { top: 0; height: 22%; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
  .focus.bottom { bottom: 0; height: 20%; -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000); }

  .tip {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: baseline; gap: 0.6rem;
    font-size: 0.8125rem; font-weight: 500; line-height: 1;
    padding: 0.45rem 0.6rem;
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px) saturate(1.3);
    backdrop-filter: blur(10px) saturate(1.3);
    border: 1px solid var(--glass-edge);
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0; transition: opacity 0.12s ease;
    pointer-events: none;
  }
  .tip.on { opacity: 1; }
  .tip b { color: var(--accent); font-weight: 500; }
  .tip span { color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  .province, .arrow {
    color: var(--ink); background: var(--glass);
    -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3);
    border: 1px solid var(--glass-edge); border-radius: 6px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }
  .province:hover, .arrow:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); }
  .province {
    position: absolute; top: 14px; right: 14px;
    height: 32px; padding: 0 0.85rem;
    font: 500 0.8125rem/1 var(--font-body);
  }
  .nav { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; }
  .arrow { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; }
  .arrow[aria-disabled="true"] { opacity: 0.35; cursor: default; background: var(--glass); border-color: var(--glass-edge); }
  .arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .province:focus-visible, .arrow:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .nogl { display: grid; place-items: center; color: var(--ink-dim); font-size: 0.875rem; text-align: center; padding: 1rem; }
  @media (prefers-reduced-motion: reduce) { .tip, .province, .arrow { transition: none; } }
</style>
</head>

    const fadeColors = (pos, base) => {

      for (let i = 0; i < n; i++) { const f = seamFade(pos[i * 3]); for (let k = 0; k < 3; k++) out[i * 3 + k] = 1 + (g[k] / b[k] - 1) * f; }
      return new THREE.BufferAttribute(out, 3);
    };

    function flatLayer(list, color, y, extra) {
      const geos = list.map(p => { const g = new THREE.ShapeGeometry(shapeOf(p[0], p.slice(1))); g.rotateX(-Math.PI / 2); return g; });
      const mg = merge(geos); mg.setAttribute('color', fadeColors(mg.attributes.position.array, color));
      const m = new THREE.Mesh(mg, new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, vertexColors: true }, extra)));
      m.position.y = y; m.receiveShadow = true; group.add(m); return m;
    }
    function merge(geos) {
      const flat = geos.map(g => g.index ? g.toNonIndexed() : g);
      let n = 0; flat.forEach(g => n += g.attributes.position.count);
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let o = 0;
      flat.forEach(g => { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; });
      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      return out;
    }
    flatLayer(SCENE.water, C.water, 0.04, { roughness: 0.7 });
    flatLayer(SCENE.park, C.park, 0.07);

    // Streets: a flat ribbon per segment, with a disc at each bend so corners close up.
    const ROAD_W = { motorway: 24, trunk: 20, primary: 17, secondary: 13, tertiary: 10, residential: 8, unclassified: 7, pedestrian: 5 };
    (function roads() {
      const v = [], idx = []; let n = 0;
      const quad = (ax, az, bx, bz, w) => {
        const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz) || 1, nx = -dz / L * w / 2, nz = dx / L * w / 2;
        v.push(ax + nx, 0, az + nz, ax - nx, 0, az - nz, bx - nx, 0, bz - nz, bx + nx, 0, bz + nz);
        idx.push(n, n + 2, n + 1, n, n + 3, n + 2); n += 4;
      };
      const disc = (x, z, w) => {
        v.push(x, 0, z); for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; v.push(x + Math.cos(a) * w / 2, 0, z + Math.sin(a) * w / 2); }
        for (let k = 0; k < 10; k++) idx.push(n, n + 1 + (k + 1) % 10, n + 1 + k); n += 11;
      };
      SCENE.roads.forEach(([cls, f]) => {
        const w = ROAD_W[cls] || 8;
        for (let i = 0; i + 3 < f.length; i += 2) quad(f[i], f[i + 1], f[i + 2], f[i + 3], w);
        for (let i = 2; i + 2 < f.length; i += 2) disc(f[i], f[i + 1], w);
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals();
      g.setAttribute('color', fadeColors(g.attributes.position.array, C.road));
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: C.road, roughness: 1, vertexColors: true }));
      m.position.y = 0.1; m.receiveShadow = true; group.add(m);

    })();

    // ---- buildings: every footprint extruded, merged into one roof mesh and one wall mesh ----
    (function buildings() {
      const wall = { p: [], n: [], c: [] }, roof = { p: [], n: [] };
      SCENE.b.forEach(([h0, f], bi) => {
        // buildings settle lower toward a neighbouring tile
        let cx = 0; for (let k = 0; k < f.length; k += 2) cx += f[k]; cx /= f.length / 2;
        const h = Math.max(2, h0 * HEIGHT_SCALE * (0.03 + 0.97 * (1 - seamFade(cx))));
        const g = new THREE.ExtrudeGeometry(shapeOf(f), { depth: h, bevelEnabled: false });
        g.rotateX(-Math.PI / 2);
        const P = g.attributes.position.array, Nn = g.attributes.normal.array;
        const tint = 0.93 + hash(bi) * 0.07;
        g.groups.forEach(gr => {
          for (let i = gr.start; i < gr.start + gr.count; i++) {
            if (gr.materialIndex === 0) { roof.p.push(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); roof.n.push(Nn[i * 3], Nn[i * 3 + 1], Nn[i * 3 + 2]); }
            else {
              wall.p.push(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); wall.n.push(Nn[i * 3], Nn[i * 3 + 1], Nn[i * 3 + 2]);
              const lift = 0.5 + 0.5 * Math.min(1, P[i * 3 + 1] / 26);     // walls darken toward the street, like contact shadow
              wall.c.push(tint * lift, tint * lift, tint * (lift * 0.97 + 0.03));
            }
          }
        });
        g.dispose();
      });
      const wg = new THREE.BufferGeometry();
      wg.setAttribute('position', new THREE.Float32BufferAttribute(wall.p, 3)); wg.setAttribute('normal', new THREE.Float32BufferAttribute(wall.n, 3));
      wg.setAttribute('color', new THREE.Float32BufferAttribute(wall.c, 3));
      const wm = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({ color: C.wall, vertexColors: true, roughness: 0.95 }));
      const rg = new THREE.BufferGeometry();
      rg.setAttribute('position', new THREE.Float32BufferAttribute(roof.p, 3)); rg.setAttribute('normal', new THREE.Float32BufferAttribute(roof.n, 3));
      const rm = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({ color: C.roof, roughness: 0.95 }));
      [wm, rm].forEach(m => { m.castShadow = m.receiveShadow = true; group.add(m); });
    })();

    // ---- trees in the parks: pale lollipops on short stalks ----
    (function trees() {
      const pts = []; let k = 0;
      SCENE.park.forEach(p => {
        const f = p[0]; let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
        for (let i = 0; i < f.length; i += 2) { x0 = Math.min(x0, f[i]); x1 = Math.max(x1, f[i]); z0 = Math.min(z0, f[i + 1]); z1 = Math.max(z1, f[i + 1]); }
        const inRing = (x, z, r) => { let c = false; for (let i = 0, j = r.length - 2; i < r.length; j = i, i += 2) if ((r[i + 1] > z) !== (r[j + 1] > z) && x < (r[j] - r[i]) * (z - r[i + 1]) / (r[j + 1] - r[i + 1]) + r[i]) c = !c; return c; };
        for (let x = x0 + 8; x < x1; x += 20) for (let z = z0 + 8; z < z1; z += 20) {
          const jx = x + (hash(k++) - 0.5) * 12, jz = z + (hash(k++) - 0.5) * 12;
          if (hash(k++) < 0.55 && hash(k++) >= seamFade(jx) && inRing(jx, jz, f) && !p.slice(1).some(h => inRing(jx, jz, h))) pts.push(jx, jz, 0.7 + hash(k++) * 0.6);
        }
      });
      const n = pts.length / 3, crown = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 9), new THREE.MeshStandardMaterial({ color: C.tree, roughness: 0.9 }), n);
      const stalk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.6, 1, 6), new THREE.MeshStandardMaterial({ color: C.stalk, roughness: 1 }), n);
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3();
      for (let i = 0; i < n; i++) {
        const s = pts[i * 3 + 2], r = 4.6 * s, hs = 6 * s;
        m.compose(pos.set(pts[i * 3], hs + r * 0.8, pts[i * 3 + 1]), q, sc.set(r, r, r)); crown.setMatrixAt(i, m);
        m.compose(pos.set(pts[i * 3], hs / 2, pts[i * 3 + 1]), q, sc.set(1, hs, 1)); stalk.setMatrixAt(i, m);
      }
      [crown, stalk].forEach(t => { t.castShadow = t.receiveShadow = true; group.add(t); });
    })();


    const halo = (y, s, o) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: C.orange, transparent: true, opacity: o, depthWrite: false, blending: THREE.AdditiveBlending })); sp.position.set(TX, y, TZ); sp.scale.set(s, s, 1); group.add(sp); };
    const glow = (y, power, reach) => { const l = new THREE.PointLight(C.orange, power, reach, 1.7); l.position.set(TX, y, TZ); group.add(l); };
    city.tower({ SCENE, group, H: city.towerH, TX, TZ, halo, glow });
    return group;
  }
  // ---- camera: a three-quarter view; a pinch moves it between the city and the tower, and a slide carries it from one tile to the next ----
  let WIDE, NEAR, foot, crown, idx = 0, active = -1, slide = null;
  let zoom = 0, goal = 0, raf = 0, lastT = 0, pointer = null;
  const pan = { x: 0, y: 0 }, panGoal = { x: 0, y: 0 };        // drift away from the home view, -1..1 on each axis
  const PAN_X = 0.075, PAN_Y = 0.08;                           // how far that reaches, as a share of the camera distance
  const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp01 = v => Math.min(1, Math.max(0, v));

  function place(z) {
    const k = ease(z), tgt = new THREE.Vector3().lerpVectors(WIDE.target, NEAR.target, k), tall = camera.aspect < 1;
    const d = lerp(WIDE.dist, NEAR.dist, k) * (tall ? 0.8 : 1), el = (lerp(WIDE.elev, NEAR.elev, k) + (tall ? 8 : 0)) * Math.PI / 180;   // a phone's tall frame looks from higher and closer, so it never sees past the data
    tgt.x += d * PAN_X * pan.x; tgt.z -= d * PAN_Y * pan.y;
    camera.position.set(tgt.x, tgt.y + Math.sin(el) * d, tgt.z + Math.cos(el) * d);
    camera.lookAt(tgt);
    camera.near = Math.max(60, d * 0.12); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    scene.fog.near = d * 1.04; scene.fog.far = d * 2.6;
  }
  // The camera's presets for the city a slide starts from and the one it ends at, blended by k.
  function setView(a, b, k) {
    const A = CITIES[a], B = CITIES[b], mix = (p, q, f) => new THREE.Vector3().lerpVectors(p, q, f);
    const pre = c => ({ wide: new THREE.Vector3(c.x + c.wide.target[0], c.wide.target[1], c.wide.target[2]), near: new THREE.Vector3(c.x + c.data.tower.x, c.towerH * 0.5, c.data.tower.z) });
    const pa = pre(A), pb = pre(B);
    WIDE = { target: mix(pa.wide, pb.wide, k), dist: lerp(A.wide.dist, B.wide.dist, k), elev: lerp(A.wide.elev, B.wide.elev, k) };
    NEAR = { target: mix(pa.near, pb.near, k), dist: lerp(A.near.dist, B.near.dist, k), elev: lerp(A.near.elev, B.near.elev, k) };
    key.target.position.set(lerp(A.x, B.x, k), 0, -280); key.position.copy(lightDir).multiplyScalar(2600).add(key.target.position);
  }
  function size() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < 1 ? 36 : 24;
    place(zoom); renderer.render(scene, camera);
  }
  function step(now) {
    const dt = lastT ? Math.min(now - lastT, 64) : 16; lastT = now;
    if (slide) {
      slide.t = Math.min(1, slide.t + dt / SLIDE_MS);
      setView(slide.a, slide.b, ease(slide.t));
      if (slide.t >= 0.5) setActive(slide.b);
      renderer.shadowMap.needsUpdate = true;                  // the shadow box travels with the view, so shadows are redrawn while it moves
      if (slide.t >= 1) { idx = slide.b; slide = null; setView(idx, idx, 0); updateArrows(); }
    }
    zoom += (goal - zoom) * (1 - Math.exp(-dt / 110));
    if (Math.abs(goal - zoom) < 0.0006) zoom = goal;
    ['x', 'y'].forEach(a => { pan[a] += (panGoal[a] - pan[a]) * (1 - Math.exp(-dt / 80)); if (Math.abs(panGoal[a] - pan[a]) < 0.0004) pan[a] = panGoal[a]; });
    place(zoom); renderer.render(scene, camera);
    if (pointer && pointer.pointerType === 'mouse' && !touches.size && !slide) hover(pointer);
    if (slide || zoom !== goal || pan.x !== panGoal.x || pan.y !== panGoal.y) raf = requestAnimationFrame(step); else { raf = 0; lastT = 0; }
  }
  function settle() {
    if (reduceMotion) { zoom = goal; pan.x = panGoal.x; pan.y = panGoal.y; place(zoom); renderer.render(scene, camera); return; }
    if (!raf) raf = requestAnimationFrame(step);
  }
  function zoomTo(g) { if (slide) return; goal = clamp01(g); settle(); }
  const clampPan = v => Math.max(-1, Math.min(1, v));
  // Move the view by a share of its range; false when it is already at the edge, so the page can take over.
  function panBy(dx, dy) {
    if (slide) return false;
    const ox = panGoal.x, oy = panGoal.y;
    panGoal.x = clampPan(ox + dx); panGoal.y = clampPan(oy + dy);
    if (panGoal.x === ox && panGoal.y === oy) return false;
    settle(); return true;
  }
  // Screen pixels to pan units: the model follows the finger, and the ground is foreshortened vertically by the camera's tilt.
  function panPx(dx, dy) {
    const per = 2 * Math.tan(camera.fov * Math.PI / 360) / stage.clientHeight, el = (lerp(WIDE.elev, NEAR.elev, ease(zoom)) + (camera.aspect < 1 ? 8 : 0)) * Math.PI / 180;
    return panBy(-dx * per / PAN_X, dy * per / (Math.sin(el) * PAN_Y));
  }

  // ---- hover: the tooltip appears only over the tower ----
  function overTower(e) {
    if (slide || !foot) return false;
    const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const a = foot.clone().project(camera), b = crown.clone().project(camera);
    const ax = (a.x + 1) / 2 * r.width, ay = (1 - a.y) / 2 * r.height, bx = (b.x + 1) / 2 * r.width, by = (1 - b.y) / 2 * r.height;
    const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t)) < 16;
  }
  const SLIDE_MS = 1100;
  let tipTimer = 0;
  function hideTip() { tip.classList.remove('on'); canvas.classList.remove('over'); clearTimeout(tipTimer); }
  function hover(e) {
    if (!overTower(e)) { hideTip(); return; }
    const rect = stage.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = e.clientX - rect.left + 14, y = e.clientY - rect.top + 18;
    if (x + tw > rect.width) x = e.clientX - rect.left - tw - 14;
    if (y + th > rect.height) y = e.clientY - rect.top - th - 14;
    tip.style.transform = 'translate(' + Math.max(0, x) + 'px,' + Math.max(0, y) + 'px)';
    tip.classList.add('on'); canvas.classList.add('over');
  }

  // ---- pinch to zoom, drag or two-finger scroll to drift a little: touch, mouse, trackpad (ctrl + wheel pinches), or Safari's gesture events ----
  const touches = new Map(); let pinch = null, g0 = 0;
  const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  const centre = () => { let x = 0, y = 0; touches.forEach(p => { x += p.x; y += p.y; }); return { x: x / touches.size, y: y / touches.size }; };
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (e.pointerType === 'mouse') { canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); hideTip(); }
    if (touches.size === 2) { pinch = { d: spread(), z: goal }; hideTip(); }
    else if (e.pointerType === 'touch') { pointer = null; hover(e); if (tip.classList.contains('on')) { clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 2200); } }
  });
  canvas.addEventListener('pointermove', e => {
    if (touches.has(e.pointerId)) {
      const was = centre(); touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && touches.size === 2) zoomTo(pinch.z + Math.log2(spread() / pinch.d) * 0.9);
      const now = centre(); panPx(now.x - was.x, now.y - was.y);
      if (e.pointerType === 'mouse') pointer = e;
      return;
    }
    if (e.pointerType === 'mouse') { pointer = e; hover(e); }
  });
  const lift = e => { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; if (!touches.size) canvas.classList.remove('drag'); };
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('pointerleave', e => { lift(e); pointer = null; if (e.pointerType === 'mouse') hideTip(); });
  canvas.addEventListener('wheel', e => {
    const k = e.deltaMode === 1 ? 16 : 1;
    if (e.ctrlKey) { e.preventDefault(); zoomTo(goal - e.deltaY * k * 0.01); return; }     // a trackpad pinch
    if (panPx(-e.deltaX * k, -e.deltaY * k)) e.preventDefault();                          // two-finger scroll; at the edge the page scrolls instead
  }, { passive: false });
  canvas.addEventListener('gesturestart', e => { e.preventDefault(); g0 = goal; });
  canvas.addEventListener('gesturechange', e => { e.preventDefault(); if (!pinch) zoomTo(g0 + Math.log2(e.scale) * 0.9); });
  canvas.addEventListener('gestureend', e => e.preventDefault());
  canvas.addEventListener('keydown', e => {
    const k = e.key, arrow = { ArrowLeft: [-0.3, 0], ArrowRight: [0.3, 0], ArrowUp: [0, 0.3], ArrowDown: [0, -0.3] }[k];
    if (arrow) { e.preventDefault(); panBy(arrow[0], arrow[1]); }
    else if (k === '+' || k === '=') zoomTo(goal + 0.25); else if (k === '-' || k === '_') zoomTo(goal - 0.25);
    else if (k === '0') { panGoal.x = panGoal.y = 0; zoomTo(0); }
    else if (k === 'PageDown') { e.preventDefault(); go(1); } else if (k === 'PageUp') { e.preventDefault(); go(-1); }
  });

  // ---- switching city: the camera slides along the row of tiles, so one city leaves to the left as the next arrives from the right ----
  function ensure(c) {
    if (!c.group) c.group = buildCity(c);
    if (!c.group.parent) { scene.add(c.group); renderer.compile(scene, camera); }
  }
  // the label, tooltip and hover target follow whichever city is closest to the middle of the view
  function setActive(i) {
    if (active === i) return;
    active = i; const c = CITIES[i], T = c.data.tower;
    foot = new THREE.Vector3(c.x + T.x, 0, T.z); crown = new THREE.Vector3(c.x + T.x, c.towerH, T.z);
    tip.querySelector('b').textContent = c.name; tip.querySelector('span').textContent = c.height;
    provinceBtn.textContent = c.province;
    canvas.setAttribute('aria-label', 'Night-time miniature of downtown ' + c.place + ': grey buildings, green parks, ' + c.feature + ' and an orange ' + c.name + '. Pinch to zoom toward the tower, drag or scroll with two fingers to look around a little, or use the arrow keys and plus and minus. Hover the tower to see its name and height.');
  }
  function updateArrows() {
    const set = (btn, to, word) => { const ok = !slide && to >= 0 && to < CITIES.length; btn.setAttribute('aria-disabled', ok ? 'false' : 'true'); btn.setAttribute('aria-label', (ok ? word + ' city: ' + CITIES[to].place : word + ' city'));  };
    set(prevBtn, idx - 1, 'Previous'); set(nextBtn, idx + 1, 'Next');
  }
  function go(delta) {
    const to = idx + delta;
    if (slide || to < 0 || to >= CITIES.length) return;
    ensure(CITIES[to]); hideTip();
    goal = 0; panGoal.x = panGoal.y = 0;                       // each city is entered at its home view
    if (reduceMotion) { idx = to; zoom = 0; pan.x = pan.y = 0; setView(idx, idx, 0); setActive(idx); renderer.shadowMap.needsUpdate = true; place(0); renderer.render(scene, camera); updateArrows(); return; }
    slide = { a: idx, b: to, t: 0 }; updateArrows();
    if (!raf) raf = requestAnimationFrame(step);
  }
  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  provinceBtn.addEventListener('click', () => { if (slide) return; goal = 0; panGoal.x = panGoal.y = 0; settle(); });

  ensure(CITIES[0]); setView(0, 0, 0); setActive(0); updateArrows();
  renderer.shadowMap.needsUpdate = true;
  new ResizeObserver(size).observe(stage);
  size();
  (window.requestIdleCallback || (f => setTimeout(f, 700)))(() => { CITIES.forEach(ensure); renderer.shadowMap.needsUpdate = true; place(zoom); renderer.render(scene, camera); });
})();
</script>
